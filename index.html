
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>로또 6/45 번호 추천기</title>

  <script>
    // 첫 화면을 그리기 전에 저장된 모드를 적용합니다.
    try {
      if (localStorage.getItem("lotto-theme") === "dark") {
        document.documentElement.dataset.theme = "dark";
      }
    } catch (error) {
      // 저장소를 사용할 수 없으면 기본 라이트 모드를 유지합니다.
    }
  </script>

  <style>
    :root {
      color-scheme: light;
      --page-bg: #f1f5f9;
      --card-bg: #fff;
      --text: #000;
      --logo: #263b7a;
      --description: #777;
      --secondary: #555;
      --notice: #999;
      --divider: #eee;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page-bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f1f5f9;
      --logo: #a5b4fc;
      --description: #cbd5e1;
      --secondary: #cbd5e1;
      --notice: #94a3b8;
      --divider: #475569;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 95%;
      max-width: 650px;
      padding: 30px 20px;
      margin: 25px auto;
      background: var(--card-bg);
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 25px #00000015;
    }

    .logo {
      display: inline-block;
      text-decoration: none;
      color: var(--logo);
      font-size: 35px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .logo span { color: #f2a900; }

    .official-logo {
      max-width: 220px;
      max-height: 90px;
      display: block;
      margin: 0 auto 10px;
    }

    h1 { font-size: 24px; }

    .description {
      color: var(--description);
      margin-bottom: 25px;
    }

    .game {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--divider);
    }

    .game-label {
      font-size: 18px;
      font-weight: bold;
      color: var(--secondary);
      width: 25px;
    }

    .numbers {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .ball {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 3px 6px #00000020;
    }

    .yellow { background: #fbc400; }
    .blue   { background: #69c8f2; }
    .red    { background: #ff7272; }
    .gray   { background: #aaaaaa; }
    .green  { background: #b0d840; }

    button {
      margin-top: 30px;
      padding: 16px 35px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }

    .theme-controls {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    .theme-toggle {
      margin-top: 0;
      padding: 9px 14px;
      font-size: 14px;
    }

    button:focus-visible {
      outline: 3px solid var(--logo);
      outline-offset: 3px;
    }

    .copy-button {
      display: block;
      max-width: 100%;
      margin: 12px auto 0;
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .copy-status {
      color: var(--secondary);
      font-size: 14px;
      min-height: 20px;
      margin: 12px 0 0;
    }

    .notice {
      color: var(--notice);
      font-size: 12px;
      margin-top: 25px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      .container { padding: 25px 10px; }
      .game { gap: 6px; }
      .numbers { gap: 5px; }
      .ball {
        width: 38px;
        height: 38px;
        font-size: 15px;
      }
      .logo { font-size: 29px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="theme-controls">
      <button id="theme-toggle" class="theme-toggle" type="button"
              aria-label="다크 모드" aria-pressed="false">다크 모드</button>
    </div>

    <!-- 공식 로고 파일을 준비하면 아래 img 사용 -->
    <!--
    <img src="lotto-logo.png"
         alt="로또 6/45 공식 로고"
         class="official-logo">
    -->

    <a class="logo"
       href="https://www.dhlottery.co.kr/lt645/intro"
       target="_blank"
       rel="noopener noreferrer">
      Lotto <span>6/45</span>
    </a>

    <h1>로또 번호 추천기</h1>

    <p class="description">
      버튼을 누르면 5게임을 추천합니다.
    </p>

    <div id="results" aria-live="polite">
      <p>아래 버튼을 눌러주세요.</p>
    </div>

    <button onclick="generateLotto()">
      로또 번호 5게임 추천
    </button>

    <button id="copy-button" class="copy-button"
            onclick="copyLotto()" disabled>
      추천 번호 복사
    </button>
    <p id="copy-status" class="copy-status" role="status"></p>

    <p class="notice">
      무작위 번호 추천 서비스입니다.<br>
      당첨을 보장하지 않습니다.<br>
      동행복권 공식 사이트가 아닙니다.
    </p>

  </main>

  <script>
    const themeToggle = document.getElementById("theme-toggle");

    function updateThemeButton() {
      const isDark = document.documentElement.dataset.theme === "dark";
      themeToggle.setAttribute("aria-pressed", String(isDark));
      themeToggle.textContent = isDark ? "라이트 모드로 전환" : "다크 모드로 전환";
    }

    themeToggle.addEventListener("click", () => {
      const theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
      updateThemeButton();
      try {
        localStorage.setItem("lotto-theme", theme);
      } catch (error) {
        // 저장에 실패해도 현재 화면의 모드 전환은 유지합니다.
      }
    });

    updateThemeButton();

    let recommendedGames = [];

    function generateLotto() {
      const results = document.getElementById("results");
      results.innerHTML = "";
      recommendedGames = [];
      document.getElementById("copy-status").textContent = "";

      const labels = ["A", "B", "C", "D", "E"];

      // 5게임 생성
      for (let game = 0; game < 5; game++) {

        const pool = Array.from(
          { length: 45 },
          (_, i) => i + 1
        );

        // 무작위로 숫자 섞기
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }

        // 중복 없는 6개 번호 선택
        const numbers = pool
          .slice(0, 6)
          .sort((a, b) => a - b);

        recommendedGames.push(`${labels[game]}: ${numbers.join(", ")}`);

        const row = document.createElement("div");
        row.className = "game";

        const label = document.createElement("div");
        label.className = "game-label";
        label.textContent = labels[game];
        row.appendChild(label);

        const numberBox = document.createElement("div");
        numberBox.className = "numbers";

        numbers.forEach(number => {
          const ball = document.createElement("div");
          ball.className = "ball";

          if (number <= 10) {
            ball.classList.add("yellow");
          } else if (number <= 20) {
            ball.classList.add("blue");
          } else if (number <= 30) {
            ball.classList.add("red");
          } else if (number <= 40) {
            ball.classList.add("gray");
          } else {
            ball.classList.add("green");
          }

          ball.textContent = number;
          numberBox.appendChild(ball);
        });

        row.appendChild(numberBox);
        results.appendChild(row);
      }

      document.getElementById("copy-button").disabled = false;
    }

    // Clipboard API를 사용할 수 없는 브라우저를 위한 보조 복사 방식
    function copyWithTextArea(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.readOnly = true;
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      textArea.style.fontSize = "16px";
      document.body.appendChild(textArea);

      try {
        textArea.focus();
        textArea.select();
        textArea.setSelectionRange(0, text.length);
        return document.execCommand("copy");
      } finally {
        textArea.remove();
        document.getElementById("copy-button").focus({ preventScroll: true });
      }
    }

    async function copyLotto() {
      if (recommendedGames.length === 0) return;

      const text = recommendedGames.join("\n");
      const status = document.getElementById("copy-status");
      let copied = false;
      status.textContent = "";

      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          copied = true;
        }
      } catch (error) {
        // 권한 거부 등으로 실패하면 보조 방식으로 다시 시도합니다.
      }

      if (!copied) {
        try {
          copied = copyWithTextArea(text);
        } catch (error) {
          copied = false;
        }
      }

      status.textContent = copied
        ? "복사 완료"
        : "복사하지 못했습니다. 브라우저의 복사 권한을 확인해 주세요.";
    }
  </script>
</body>
</html>
